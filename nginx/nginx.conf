server {
        listen 80 default_server;
        listen [::]:80 default_server;

        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        root /var/www/html;

        index index.html index.htm index.nginx-debian.html;

        server_name ethereumprague.com ethereumprague.com;

        location / {
            root /var/www/html;
            try_files $uri /index.html;
        }
}